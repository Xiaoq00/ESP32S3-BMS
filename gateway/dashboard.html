<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>电瓶状态</title>
<style>
  :root{
    --bg:#eef2f6; --card:#ffffff; --fg:#1c2733; --mut:#6b7a8d;
    --ok:#1faa59; --warn:#e0a106; --bad:#e23b3b; --accent:#1c7ed6;
    --line:#e2e8f0; --shadow:0 2px 10px rgba(20,40,70,.08);
    --big:clamp(40px,13vw,68px); --mid:clamp(26px,7vw,34px); --lbl:clamp(15px,4.2vw,18px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.35;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 28px}

  /* 顶部状态条 */
  .head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .head .bt{width:46px;height:46px;flex:0 0 auto;color:var(--accent)}
  .head h1{font-size:clamp(22px,6vw,28px);margin:0;font-weight:700;letter-spacing:1px}
  .pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;
    font-size:var(--lbl);font-weight:700;padding:8px 14px;border-radius:999px;background:#dfeede;color:var(--ok)}
  .pill .d{width:11px;height:11px;border-radius:50%;background:var(--ok)}
  .pill.off{background:#fbe3e3;color:var(--bad)} .pill.off .d{background:var(--bad)}
  .demo{background:#fff5d6;color:#8a6d00;border:1px solid #f0dD88;
    font-size:var(--lbl);font-weight:700;padding:8px 12px;border-radius:10px;margin-bottom:12px;text-align:center}

  /* 大卡片 */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .big{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
  .big .top{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:var(--lbl);font-weight:600}
  .big .top svg{width:24px;height:24px;color:var(--accent)}
  .big .num{font-size:var(--big);font-weight:800;line-height:1.05;margin-top:8px;display:flex;align-items:baseline;gap:6px}
  .big .num .u{font-size:var(--mid);font-weight:700;color:var(--mut)}
  .batwrap{margin-top:10px}
  .batwrap svg{width:100%;height:46px;display:block}

  /* 指标网格 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .m{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
  .m .top{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:var(--lbl);font-weight:600}
  .m .top svg{width:22px;height:22px;color:var(--accent)}
  .m .v{font-size:var(--mid);font-weight:800;margin-top:6px}
  .m .sub{font-size:14px;color:var(--mut);margin-top:3px}
  .g{color:var(--ok)} .w{color:var(--warn)} .b{color:var(--bad)}

  /* 电芯 */
  .sec{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .sec .h{display:flex;align-items:center;gap:8px;font-size:var(--lbl);font-weight:700;color:var(--mut);margin-bottom:4px}
  .sec .h svg{width:22px;height:22px;color:var(--accent)}
  .legend{font-size:13px;color:var(--mut);margin:2px 0 12px;display:flex;gap:14px;flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .cells{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .cell{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
  .cell .n{font-size:13px;color:var(--mut);font-weight:600}
  .cell .vv{font-size:clamp(16px,4.6vw,19px);font-weight:800;margin-top:3px}
  .cell .bar{height:7px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
  .cell .bar i{display:block;height:100%;border-radius:4px}

  .foot{text-align:center;color:var(--mut);font-size:14px;margin-top:6px}
  .say{background:#eaf3ff;border:1px solid #cfe2ff;border-radius:14px;padding:13px 14px;
    font-size:var(--lbl);line-height:1.5;margin-bottom:12px;color:#143b66}
  .say b{color:#0b56b0}

  /* 波形 */
  .tabs{display:flex;gap:8px;margin:4px 0 10px}
  .tab{flex:1;border:1px solid var(--line);background:#f6f9fc;color:var(--mut);
    font-size:var(--lbl);font-weight:700;padding:11px 0;border-radius:12px;cursor:pointer}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .wbtn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:var(--lbl);font-weight:700;cursor:pointer}
  .wbtn.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .wbtn:active{transform:translateY(1px)}
  #wave{width:100%;height:220px;display:block}
  .wstat{font-size:var(--mid);font-weight:800;margin:2px 0 8px;color:var(--fg)}
  .wmsg{font-size:var(--lbl);color:var(--mut);text-align:center;padding:24px 0}

  @media (max-width:380px){.cells{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="bt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="12" x2="13" y2="12"/></svg>
    <h1>电瓶状态</h1>
    <span id="pill" class="pill"><span class="d"></span><span id="pillt">在线</span></span>
  </div>

  <div id="demo" class="demo" style="display:none">演示数据（接口暂不可用，显示示例）</div>

  <div class="say" id="say" style="display:none"></div>

  <!-- 两个大卡 -->
  <div class="hero">
    <div class="big">
      <div class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>剩余电量</div>
      <div class="num"><span id="socN">--</span><span class="u">%</span></div>
      <div class="batwrap"><svg id="batSvg" viewBox="0 0 200 46" preserveAspectRatio="none">
        <rect x="2" y="4" width="184" height="38" rx="6" fill="none" stroke="#cbd5e1" stroke-width="3"/>
        <rect x="188" y="15" width="8" height="16" rx="2" fill="#cbd5e1"/>
        <rect id="batFill" x="6" y="8" width="0" height="30" rx="4" fill="var(--ok)"/>
      </svg></div>
    </div>
    <div class="big">
      <div class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>总电压</div>
      <div class="num"><span id="volN">--</span><span class="u">V</span></div>
      <div class="sub" style="font-size:14px;color:var(--mut);margin-top:8px" id="capLine">容量 -- / -- Ah</div>
    </div>
  </div>

  <!-- 指标网格 -->
  <div class="grid">
    <div class="m">
      <div class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7" id="curArr"/></svg>充放电</div>
      <div class="v" id="curV">--</div>
      <div class="sub" id="powV">功率 -- W</div>
    </div>
    <div class="m">
      <div class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2 2 0 0 0-4 0v11.26a4 4 0 1 0 4 0z"/></svg>温度</div>
      <div class="v" id="tempV">--</div>
      <div class="sub" id="tempSub">探头状态</div>
    </div>
    <div class="m">
      <div class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>电芯均衡</div>
      <div class="v" id="balV">--</div>
      <div class="sub" id="balSub">压差</div>
    </div>
    <div class="m">
      <div class="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.3" fill="currentColor" stroke="none"/></svg>无线信号</div>
      <div class="v" id="rssiV">--</div>
      <div class="sub">监测板联网</div>
    </div>
  </div>

  <!-- BMS 设置（破解读取，只读展示） -->
  <div class="sec" id="bmsSetSec" style="display:none">
    <div class="h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>BMS 设置</div>
    <div class="grid" id="bmsSet" style="margin-bottom:0"></div>
    <div class="legend" style="margin:10px 0 0">数据来自破解读取（0x01 设置帧）；带“待核对”的阈值建议以官方 JK App 显示为准</div>
  </div>

  <!-- 用电波形 -->
  <div class="sec">
    <div class="h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>用电波形</div>
    <div class="tabs">
      <button class="tab on" data-r="day">一天</button>
      <button class="tab" data-r="week">一周</button>
      <button class="tab" data-r="month">一月</button>
    </div>
    <div class="wstat" id="waveStat"></div>
    <canvas id="wave"></canvas>
    <div class="wmsg" id="waveMsg" style="display:none"></div>
  </div>

  <!-- 电芯 -->
  <div class="sec">
    <div class="h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>20 节电芯电压</div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>均衡好</span>
      <span><i style="background:var(--warn)"></i>略有偏差</span>
      <span><i style="background:var(--bad)"></i>偏差大</span>
    </div>
    <div class="cells" id="cells"></div>
  </div>

  <div class="foot" id="foot">正在连接…</div>
</div>

<script>
/* ===== 演示数据（仅当接口全部不可用时兜底显示） ===== */
const DEMO = {
  online:true, updated_at:new Date().toLocaleString("zh-CN"), age_seconds:2,
  pack:{voltage:66.71, current:-23.4, power:-1558, soc:99, remaining_ah:117.8, total_ah:119.0, temp1:-200, temp2:35.2},
  cells:[3.334,3.334,3.339,3.334,3.332,3.332,3.341,3.351,3.341,3.341,3.341,3.332,3.334,3.332,3.334,3.332,3.332,3.332,3.332,3.334],
  cell_stats:{min_v:3.332,max_v:3.351,delta_mv:19,mean_v:3.335},
  rssi:-61,
  summary_text:"电池在线，最后更新于刚刚。总电压 66.71V，放电 23.4A，SOC 99%，剩余 117.8Ah。20芯电压 3.332~3.351V，压差 19mV，均衡良好。温度1 断线，温度2 35.2℃。"
};
/* ============================================== */

const $ = id => document.getElementById(id);
function colorForDev(mv){ return mv>30?'var(--bad)':mv>10?'var(--warn)':'var(--ok)'; }

let curRange = 'day';
let waveData = null;

// 任何脚本异常都显示出来，避免“静默横杠”
window.addEventListener('error', function(ev){
  const f = $('foot'); if(f){ f.style.color = 'var(--bad)'; f.textContent = '页面脚本出错：' + ev.message; }
});

async function load(){
  const BASE = location.pathname.startsWith('/bms') ? '/bms' : '';
  let summary=null, data=null, settings=null, errMsg='';
  try{ const r=await fetch(BASE+'/api/summary',{cache:'no-store'}); if(r.ok) summary=await r.json(); }
  catch(e){ errMsg += 'summary:'+e; }
  try{ const r2=await fetch(BASE+'/api/data',{cache:'no-store'}); if(r2.ok) data=await r2.json(); }
  catch(e){ errMsg += ' data:'+e; }
  try{ const r3=await fetch(BASE+'/api/settings',{cache:'no-store'}); if(r3.ok) settings=await r3.json(); }
  catch(e){ errMsg += ' settings:'+e; }

  // 合并：优先 summary 的丰富字段，缺失处用 /api/data(MQTT 实时内存态) 兜底
  let j = (summary && typeof summary==='object') ? summary : {};
  if(settings && typeof settings==='object') j.settings = settings;
  if(data && typeof data==='object'){
    if(j.online===undefined) j.online = data.online;
    if(!j.pack) j.pack = {};
    const p = j.pack;
    if(p.voltage==null) p.voltage = data.total;
    if(!j.cells || !j.cells.length) j.cells = data.cells||[];
    if(!j.cell_stats) j.cell_stats = {min_v:data.min, max_v:data.max, delta_mv:Math.round((data.bal||0)*1000)};
    if(j.rssi==null) j.rssi = data.rssi;
    if(j.age_seconds==null) j.age_seconds = 0;
    if(!j.updated_at) j.updated_at = null;
  }

  // 判断是否真拿到数据；完全没有则回退演示（带黄条），绝不留全横杠
  const hasData = (j.pack && (j.pack.voltage!=null || j.pack.soc!=null)) || (j.cells && j.cells.length);
  let demo=false;
  if(!hasData){ j = DEMO; demo = true; }

  // 顶部状态
  $('pill').className = 'pill' + (j.online ? '' : ' off');
  $('pillt').textContent = j.online ? '在线' : '离线';
  $('demo').style.display = demo ? 'block' : 'none';

  const p = j.pack || {};

  // 电量 + 电池条
  const soc = (p.soc!=null) ? Math.round(p.soc) : null;
  if(soc!=null){ $('socN').textContent = soc; }
  else { $('socN').textContent = '—'; }
  const fillW = (soc!=null? soc : 0);
  $('batFill').setAttribute('width', (176*fillW/100).toFixed(1));
  $('batFill').setAttribute('fill', soc!=null?(soc<20?'var(--bad)':soc<50?'var(--warn)':'var(--ok)'):'var(--mut)');

  // 总电压 + 容量
  $('volN').textContent = (p.voltage!=null)? p.voltage.toFixed(2) : '--';
  if(p.remaining_ah!=null){ $('capLine').textContent = '容量 '+p.remaining_ah.toFixed(1)+' / '+(p.total_ah!=null?p.total_ah.toFixed(1):'--')+' Ah'; }
  else { $('capLine').textContent = '容量 -- / -- Ah'; }

  // 充放电
  const cur = p.current;
  if(cur!=null && Math.abs(cur)>0.01){
    const charging = cur>0;
    $('curV').textContent = (charging?'充电 ':'放电 ')+Math.abs(cur).toFixed(1)+' A';
    $('curV').className = 'v ' + (charging?'g':'w');
    $('curArr').setAttribute('d', charging ? 'M5 12l7-7 7 7' : 'M19 12l-7 7-7-7');
  } else if(cur!=null){
    $('curV').textContent = '静置'; $('curV').className='v';
    $('curArr').setAttribute('d','M12 12h0.1');
  } else { $('curV').textContent='--'; $('curV').className='v'; }
  if(p.power!=null){ $('powV').textContent = '功率 '+Math.abs(p.power).toFixed(0)+' W'; }
  else { $('powV').textContent='功率 -- W'; }

  // 温度（temp1 哨兵 -200=断线）
  const t1 = p.temp1, t2 = p.temp2;
  let shown=null, txt='--', sub='--';
  if(t2!=null && t2>-100){ shown=t2; }
  else if(t1!=null && t1>-100){ shown=t1; }
  if(shown!=null){
    txt = shown.toFixed(1)+' ℃';
    sub = (t2!=null&&t2>-100 && t1!=null&&t1<=-100)?'两路正常':(t1!=null&&t1<=-100?'1路断线':'正常');
    const cls = shown>55?'b':shown>45?'w':'g';
    $('tempV').className='v '+cls;
  } else {
    txt = (t1!=null&&t1<=-100&&t2!=null&&t2<=-100)?'均断线':'--';
    sub = '探头未连接'; $('tempV').className='v';
  }
  $('tempV').textContent=txt; $('tempSub').textContent=sub;

  // 均衡
  const dmv = (j.cell_stats && j.cell_stats.delta_mv!=null)? j.cell_stats.delta_mv : null;
  if(dmv!=null){ $('balV').textContent = dmv+' mV'; }
  else { $('balV').textContent='--'; }
  if(dmv!=null){ $('balV').className='v '+(dmv<20?'g':dmv<50?'w':'b'); $('balSub').textContent = dmv<20?'压差小·均衡好':dmv<50?'压差一般':'压差大·需关注'; }
  else { $('balV').className='v'; $('balSub').textContent='压差'; }

  // 信号
  $('rssiV').textContent = (j.rssi!=null)? j.rssi+' dBm' : '--';

  // 一句话播报
  if(j.summary_text){ $('say').style.display='block'; $('say').innerHTML = '<b>状态：</b>'+j.summary_text; }
  else { $('say').style.display='none'; }

  // 电芯
  const cells = j.cells||[];
  const cmax = (j.cell_stats&&j.cell_stats.max_v!=null)? j.cell_stats.max_v : (cells.length?Math.max(...cells):null);
  const wrap = $('cells'); wrap.innerHTML='';
  cells.forEach((v,i)=>{
    const dev = cmax!=null ? Math.round((cmax-v)*1000) : 0;
    const col = colorForDev(dev);
    const el = document.createElement('div'); el.className='cell';
    el.innerHTML = '<div class="n">第'+(i+1)+'节</div><div class="vv" style="color:'+col+'">'+Number(v).toFixed(3)+'</div>'+
      '<div class="bar"><i style="width:'+Math.min(100,v/4.25*100).toFixed(1)+'%;background:'+col+'"></i></div>';
    wrap.appendChild(el);
  });

  // 底部状态/时间
  const foot = $('foot');
  if(demo){ foot.style.color='var(--warn)'; foot.textContent='⚠ 接口暂不可用，当前显示演示数据'; }
  else if(errMsg){ foot.style.color='var(--mut)'; foot.textContent='实时数据已连接（部分接口异常：'+errMsg+'）'; }
  else if(j.online && j.age_seconds!=null && j.updated_at){ foot.style.color='var(--mut)'; foot.textContent='每 3 秒自动刷新 · 更新于 '+j.updated_at+'（'+j.age_seconds+' 秒前）'; }
  else if(!j.online){ foot.style.color='var(--bad)'; foot.textContent='电瓶当前离线'+(j.updated_at?'，最后更新 '+j.updated_at:''); }
  else { foot.style.color='var(--mut)'; foot.textContent='每 3 秒自动刷新'; }

  loadHistory();
}

function renderSettings(s){
  const sec=$('bmsSetSec');
  if(!s || !s.model){ sec.style.display='none'; return; }
  sec.style.display='block';
  const balOn = s.balance_enabled_raw===1;
  const trig = (s.balance_start_mv_raw!=null)? s.balance_start_mv_raw : 10;
  const rows=[
    ['型号', esc(s.model)],
    ['串数', (s.cell_count!=null? s.cell_count : '?')+'S'],
    ['容量', (s.capacity_ah!=null? Number(s.capacity_ah).toFixed(1) : '--')+' Ah'],
    ['均衡开关', balOn ? '<span class="g">开</span>' : '<span class="b">关</span>'],
    ['均衡启动压差', trig+' mV <span style="color:var(--mut);font-size:12px">(待App核对)</span>']
  ];
  let html = rows.map(r=>
    '<div class="m"><div class="top">'+r[0]+'</div><div class="v">'+r[1]+'</div></div>'
  ).join('');
  // 写入控制区(仅均衡开关 + 触发压差; 以读回校验为准)
  html += '<div class="m" style="grid-column:1/-1;background:#f6f9fc">'+
    '<div class="top">写入控制（仅均衡，需官方 App 密码时本板无法写入）</div>'+
    '<div class="v" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
      '<button class="wbtn" onclick="doWrite(\'balance\','+(balOn?0:1)+')">'+(balOn?'关闭均衡':'开启均衡')+'</button>'+
      '<span style="font-size:14px;color:var(--mut)">均衡触发压差</span>'+
      '<input id="trigIn" type="number" min="1" max="500" value="'+trig+'" style="width:84px;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:16px">'+
      '<span style="font-size:14px;color:var(--mut)">mV</span>'+
      '<button class="wbtn sec" onclick="doWrite(\'balance_trigger\', parseInt(document.getElementById(\'trigIn\').value))">写入阈值</button>'+
    '</div>'+
    '<div id="bmsSetMsg" style="margin-top:8px;font-size:14px;color:var(--mut)"></div>'+
  '</div>';
  $('bmsSet').innerHTML = html;
}

// 写 BMS 设置: 显式确认 -> 转发 -> 轮询读回校验
function doWrite(action, value){
  if(value===undefined || value===null || (action==='balance_trigger' && isNaN(value))){ $('bmsSetMsg').textContent='✗ 阈值无效'; $('bmsSetMsg').style.color='var(--bad)'; return; }
  const label = action==='balance' ? ('均衡'+(value?'开启':'关闭')) : ('均衡触发压差='+value+'mV');
  if(!confirm('确认通过本监控板写入 BMS 吗？\n'+label+'\n（写入以读回校验为准；若 BMS 未变更，可能需在官方 JK App 输入设备密码解锁）')) return;
  const BASE = location.pathname.startsWith('/bms') ? '/bms' : '';
  $('bmsSetMsg').style.color='var(--mut)';
  $('bmsSetMsg').textContent='指令已送达监控板，正在读回校验…';
  fetch(BASE+'/api/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action,value:value})})
    .then(r=>r.json()).then(j=>{
      if(j.error){ $('bmsSetMsg').textContent='✗ '+j.error; $('bmsSetMsg').style.color='var(--bad)'; return; }
      let tries=0;
      const iv=setInterval(()=>{
        tries++;
        fetch(BASE+'/api/settings',{cache:'no-store'}).then(r=>r.json()).then(s=>{
          let ok=false;
          if(action==='balance') ok = (s.balance_enabled_raw===(value?1:0));
          if(action==='balance_trigger') ok = (s.balance_start_mv_raw===value);
          if(ok){ clearInterval(iv); $('bmsSetMsg').textContent='✓ 已生效（读回校验通过）'; $('bmsSetMsg').style.color='var(--ok)'; load(); }
          else if(tries>=6){ clearInterval(iv); $('bmsSetMsg').textContent='✗ BMS 未确认变更（可能需先在官方 JK App 输入设备密码解锁写入，或本板写地址不匹配）'; $('bmsSetMsg').style.color='var(--bad)'; }
        }).catch(()=>{ if(tries>=6) clearInterval(iv); });
      }, 1500);
    }).catch(e=>{ $('bmsSetMsg').textContent='✗ 请求失败: '+e; $('bmsSetMsg').style.color='var(--bad)'; });
}
function esc(t){ return String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

async function loadHistory(){
  const BASE = location.pathname.startsWith('/bms') ? '/bms' : '';
  try{
    const r=await fetch(BASE+'/api/history?range='+curRange,{cache:'no-store'});
    if(r.ok){
      waveData=await r.json();
      drawWave();
      if(curRange==='day'){
        let s='今日用电 '+(waveData.today_energy_kwh!=null?waveData.today_energy_kwh.toFixed(2):'—')+' kWh';
        if(waveData.peak_cell_delta_mv!=null) s+='　·　今日峰值压差 '+waveData.peak_cell_delta_mv.toFixed(0)+'mV'+(waveData.peak_cell_delta_cell?('（第'+waveData.peak_cell_delta_cell+'节）'):'');
        $('waveStat').textContent=s;
      } else {
        // 周/月：显示该区间内出现过的每日最大压差峰值 + 异常电芯（均衡/压差总会用）
        let md=0, mc=null;
        (waveData.series||[]).forEach(b=>{ if(b.cell_delta_max_mv!=null && b.cell_delta_max_mv>md){ md=b.cell_delta_max_mv; mc=b.cell_delta_max_cell; } });
        $('waveStat').textContent=(curRange==='week'?'本周':'本月')+'峰值压差 '+(md>0? md.toFixed(0)+'mV'+(mc?('（第'+mc+'节）'):''):'累计中…');
      }
    }
  }catch(e){}
}

function drawWave(){
  const cv=$('wave'); if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||cv.parentElement.clientWidth, H=220;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const series=(waveData&&waveData.series)||[];
  if(!series.length){ $('waveMsg').style.display='block'; $('waveMsg').textContent='暂无数据（看板在线后开始累计）'; return; }
  $('waveMsg').style.display='none';

  const padL=46,padR=12,padT=16,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const blue='#1c7ed6', mut='#9aa7b5', grid='#eef2f6';
  ctx.strokeStyle=grid; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=padT+plotH*i/4; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+plotW,y); ctx.stroke(); }

  if(waveData.unit!=='day'){
    // 周/月：柱=每日用电量(kWh) + 线=日均功率(W，向上=用电)
    const n=series.length;
    const maxE=Math.max(0.001,...series.map(b=>b.energy_kwh||0));
    const maxP=Math.max(1,...series.map(b=>-(b.power||0)));
    const bw=Math.max(6, plotW/n*0.62);
    series.forEach((b,i)=>{
      const cx=padL+(i+0.5)/n*plotW;
      const eh=(b.energy_kwh||0)/maxE*plotH;
      ctx.fillStyle='rgba(226,59,59,.55)';
      ctx.fillRect(cx-bw/2, padT+plotH-eh, bw, eh);
    });
    ctx.beginPath();
    series.forEach((b,i)=>{
      const cx=padL+(i+0.5)/n*plotW;
      const py=padT+plotH-(-(b.power||0))/maxP*plotH;
      i?ctx.lineTo(cx,py):ctx.moveTo(cx,py);
    });
    ctx.strokeStyle=blue; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=mut; ctx.font='12px system-ui'; ctx.textAlign='left';
    ctx.fillText('柱=每日用电量(kWh)  线=日均功率(W)', padL, padT-3);
    ctx.textAlign='center';
    [0, Math.floor(n/2), n-1].forEach(i=>{
      const d=new Date(series[i].t); const lbl=(d.getMonth()+1)+'/'+d.getDate();
      ctx.fillText(lbl, padL+(i+0.5)/n*plotW, H-8);
    });
    ctx.textAlign='left';
  } else {
    // 天：连续时间功率曲线（consumption 向上为正）
    const pts=series.map(s=>({x:s.t, y:-(s.power||0)}));
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    let ymin=Math.min(0,...ys), ymax=Math.max(0,...ys);
    if(ymax-ymin<2){ ymax=ymin+2; }
    const t0=Math.min(...xs), t1=Math.max(...xs);
    const X=t=> padL + (t1>t0?(t-t0)/(t1-t0):0.5)*plotW;
    const Y=v=> padT + (ymax-v)/(ymax-ymin)*plotH;
    ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(padL,Y(0)); ctx.lineTo(padL+plotW,Y(0)); ctx.stroke();
    ctx.beginPath();
    pts.forEach((p,i)=>{ const xx=X(p.x),yy=Y(p.y); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); });
    ctx.lineTo(X(pts[pts.length-1].x), Y(0)); ctx.lineTo(X(pts[0].x), Y(0)); ctx.closePath();
    ctx.fillStyle='rgba(28,126,214,.12)'; ctx.fill();
    ctx.beginPath();
    pts.forEach((p,i)=>{ const xx=X(p.x),yy=Y(p.y); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); });
    ctx.strokeStyle=blue; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=mut; ctx.font='12px system-ui'; ctx.textAlign='left';
    ctx.fillText('↑用电  ↓充电 (W)', padL, padT-3);
    ctx.fillText(Math.round(ymax)+'W', 4, padT+10);
    ctx.fillText(Math.round(ymin)+'W', 4, padT+plotH);
    ctx.textAlign='center';
    const fmtH=t=>{ const d=new Date(t); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
    ctx.fillText(fmtH(t0), padL, H-8);
    ctx.fillText(fmtH(t1), padL+plotW, H-8);
    ctx.textAlign='left';
  }
}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on'); curRange=btn.dataset.r; loadHistory();
  });
});

load();
setInterval(load, 3000);
</script>
</body>
</html>
